name: Godot project validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Import, parse and launch project
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Godot 4.7
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-mono: false

      - name: Verify engine version
        run: godot --version

      - name: Import project and parse scripts
        run: godot --headless --editor --path . --quit

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 10
